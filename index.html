  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F5F5;
      --white: #FFFFFF;
      --text-primary: #1A1A2E;
      --text-secondary: #555770;
      --text-muted: #8E8EA0;
      --border: #E5E7EB;
      --border-light: #F0F0F3;
      --accent: #00C853;
      --accent-dark: #00A843;
      --accent-light: #E8F5E9;
      --danger: #FF3D00;
      --coupon-bg: #F3E5F5;
      --coupon-border: #CE93D8;
      --coupon-text: #7B1FA2;
      --save-color: #E91E63;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,.12);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-pill: 999px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER ===== */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
    }
    .logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: var(--text-primary); flex-shrink: 0;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #00C853, #00BFA5);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: #fff;
      box-shadow: 0 2px 8px rgba(0,200,83,.25);
    }
    .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
    .logo-text span { color: var(--accent); }

    .search-box {
      flex: 1; max-width: 480px; position: relative;
    }
    .search-box input {
      width: 100%; height: 40px; border-radius: var(--radius-pill);
      border: 1.5px solid var(--border);
      padding: 0 16px 0 40px;
      font-size: 14px; font-family: inherit; color: var(--text-primary);
      background: var(--bg); outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,83,.12);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--text-muted); pointer-events: none;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-vip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-pill);
      background: #25D366; color: #fff;
      font-size: 13px; font-weight: 700;
      text-decoration: none; border: none; cursor: pointer;
      transition: background .2s, box-shadow .2s;
      box-shadow: 0 2px 8px rgba(37,211,102,.25);
    }
    .btn-vip:hover { background: #1FAD55; }
    .btn-vip svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-insta {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--radius-pill);
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff; font-size: 13px; font-weight: 700;
      text-decoration: none; transition: opacity .2s;
    }
    .btn-insta:hover { opacity: .9; }
    .btn-insta svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ===== CATEGORIES BAR ===== */
    .categories-bar {
      position: fixed; top: 57px; left: 0; right: 0; z-index: 99;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .categories-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      overflow-x: auto;
      -ms-overflow-style: none; scrollbar-width: none;
    }
    .categories-inner::-webkit-scrollbar { display: none; }

    .cat-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: var(--radius-pill);
      border: 1.5px solid var(--border);
      background: var(--white); color: var(--text-secondary);
      font-size: 12.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: all .2s;
    }
    .cat-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
    .cat-btn.active {
      background: var(--accent); color: #fff;
      border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,200,83,.2);
    }
    .cat-btn .cat-count {
      font-size: 10.5px; font-weight: 700;
      background: rgba(0,0,0,.08); padding: 1px 6px;
      border-radius: var(--radius-pill);
    }
    .cat-btn.active .cat-count { background: rgba(255,255,255,.25); }
    .cat-btn .cat-dot {
      width: 7px; height: 7px; border-radius: 50%;
    }

    /* ===== SORTING BAR ===== */
    .sort-bar {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
    }
    .sort-bar .count { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .sort-select {
      padding: 7px 12px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--white);
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      font-family: inherit; cursor: pointer; outline: none;
      transition: border-color .2s;
    }
    .sort-select:focus { border-color: var(--accent); }

    /* ===== MAIN ===== */
    .main-content {
      max-width: 1280px; margin: 0 auto;
      padding: 0 16px 40px;
      padding-top: 118px;
    }

    /* ===== GRID ===== */
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* ===== CARD ===== */
    .card {
      display: flex; flex-direction: column;
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border-light);
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .card.highlighted {
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,83,.12);
    }

    .card-img {
      position: relative; aspect-ratio: 1/1;
      background: #FAFAFA; padding: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .card-img img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      transition: transform .3s;
    }
    .card:hover .card-img img { transform: scale(1.05); }

    .card-store-badge {
      position: absolute; top: 10px; left: 10px;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: var(--radius-pill);
      font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
      text-transform: uppercase;
      background: rgba(255,255,255,.92); backdrop-filter: blur(4px);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .card-store-badge .store-dot { width: 6px; height: 6px; border-radius: 50%; }

    .card-discount-badge {
      position: absolute; top: 10px; right: 10px;
      padding: 4px 10px; border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 800; color: #fff;
      background: var(--accent);
    }
    .card-coupon-badge {
      position: absolute; top: 10px; right: 10px;
      padding: 4px 10px; border-radius: var(--radius-sm);
      font-size: 11px; font-weight: 800; color: #fff;
      background: var(--coupon-text);
    }

    .card-time-badge {
      position: absolute; bottom: 8px; left: 10px;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: var(--radius-sm);
      font-size: 10.5px; font-weight: 600; color: var(--text-secondary);
      background: rgba(255,255,255,.92); backdrop-filter: blur(4px);
      border: 1px solid var(--border);
    }
    .card-time-badge svg { width: 12px; height: 12px; color: var(--accent); }

    .card-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }

    .card-highlighted-tag {
      display: inline-block; margin-bottom: 6px;
      padding: 2px 8px; border-radius: var(--radius-pill);
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      background: var(--accent-light); color: var(--accent-dark);
    }

    .card-title {
      font-size: 14px; font-weight: 600; line-height: 1.4;
      color: var(--text-primary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-pricing { margin-top: auto; padding-top: 12px; }
    .card-price-old {
      font-size: 12px; color: var(--text-muted);
      text-decoration: line-through;
    }
    .card-price-current {
      font-size: 22px; font-weight: 800; color: var(--accent-dark);
      letter-spacing: -.5px; margin-top: 2px;
    }

    .card-coupon-only-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      color: var(--coupon-text); letter-spacing: .3px;
    }
    .card-coupon-only-value {
      font-size: 17px; font-weight: 800; color: var(--accent-dark);
      margin-top: 2px;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Coupon strip */
    .card-coupon-strip {
      margin-top: 10px; padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1.5px dashed var(--coupon-border);
      background: var(--coupon-bg);
    }
    .card-coupon-strip-top {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .card-coupon-strip-label {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      color: var(--coupon-text); letter-spacing: .3px;
    }
    .card-coupon-strip code {
      font-size: 12px; font-weight: 800; letter-spacing: .5px;
      color: var(--coupon-text); background: rgba(123,31,162,.08);
      padding: 2px 8px; border-radius: 4px; border: 1px solid var(--coupon-border);
      font-family: 'Courier New', monospace;
    }
    .card-coupon-strip-rule {
      font-size: 11px; color: var(--text-secondary); margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Actions */
    .card-actions { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }

    .card-actions-row { display: flex; gap: 6px; }

    .btn-copy-coupon {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--coupon-border);
      background: var(--coupon-bg); color: var(--coupon-text);
      font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all .2s; flex-shrink: 0;
      font-family: inherit;
    }
    .btn-copy-coupon:hover { background: #E1BEE7; }
    .btn-copy-coupon.copied {
      background: var(--accent-light) !important;
      border-color: var(--accent) !important;
      color: var(--accent-dark) !important;
    }
    .btn-copy-coupon svg { width: 14px; height: 14px; flex-shrink: 0; }

    .btn-ver-oferta {
      display: flex; flex: 1; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 700;
      text-decoration: none; border: none; cursor: pointer;
      transition: background .2s, box-shadow .2s;
      box-shadow: 0 2px 6px rgba(0,200,83,.2);
    }
    .btn-ver-oferta:hover { background: var(--accent-dark); box-shadow: 0 4px 12px rgba(0,200,83,.3); }
    .btn-ver-oferta svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-save, .btn-share {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 10px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--white); color: var(--text-secondary);
      font-size: 11.5px; font-weight: 600;
      cursor: pointer; transition: all .2s; flex: 1;
      font-family: inherit; text-decoration: none;
    }
    .btn-save:hover { border-color: var(--save-color); color: var(--save-color); }
    .btn-save.saved { border-color: var(--save-color); background: #FCE4EC; color: var(--save-color); }
    .btn-save svg, .btn-share svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn-share:hover { border-color: #25D366; color: #25D366; }

    /* ===== VIP BANNER ===== */
    .vip-banner {
      grid-column: 1 / -1;
      border-radius: var(--radius);
      padding: 20px 24px;
      background: linear-gradient(135deg, #E8F5E9 0%, #F3E5F5 100%);
      border: 1.5px solid var(--accent);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    }
    .vip-banner-text { flex: 1; min-width: 200px; }
    .vip-banner-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: var(--radius-pill);
      background: var(--accent); color: #fff;
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 6px;
    }
    .vip-banner h3 {
      font-size: 17px; font-weight: 800; color: var(--text-primary);
    }
    .vip-banner p {
      font-size: 13px; color: var(--text-secondary); margin-top: 4px; max-width: 500px;
    }
    .vip-banner-actions { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      display: none; text-align: center; padding: 48px 20px;
      border: 2px dashed var(--border); border-radius: var(--radius);
      background: var(--white);
    }
    .empty-state.visible { display: block; }
    .empty-state h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .empty-state p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .btn-reset {
      margin-top: 14px; padding: 9px 20px;
      border-radius: var(--radius-sm); border: 1.5px solid var(--border);
      background: var(--white); color: var(--text-secondary);
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all .2s;
    }
    .btn-reset:hover { border-color: var(--accent); color: var(--accent-dark); }

    /* ===== FOOTER ===== */
    .footer {
      border-top: 1px solid var(--border);
      text-align: center; padding: 20px 16px;
      font-size: 12px; color: var(--text-muted);
      background: var(--white);
    }

    /* ===== SKELETON LOADER ===== */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      border-radius: var(--radius); overflow: hidden;
      background: var(--white); border: 1px solid var(--border-light);
    }
    .skeleton-block {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }

    /* ===== STORE DOT COLORS ===== */
    .dot-ml { background: #FFE600; }
    .dot-shopee { background: #EE4D2D; }
    .dot-amazon { background: #FF9900; }
    .dot-magalu { background: #0086FF; }
    .dot-default { background: var(--accent); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .header-inner { flex-wrap: wrap; }
      .search-box { order: 3; max-width: 100%; width: 100%; }
      .btn-insta span, .btn-vip span { display: none; }
      .btn-insta, .btn-vip { padding: 8px 10px; }
      .main-content { padding-top: 155px; }
      .offers-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .card-price-current { font-size: 18px; }
      .card-title { font-size: 12.5px; }
      .vip-banner { padding: 16px; }
      .vip-banner h3 { font-size: 15px; }
    }
    @media (max-width: 480px) {
      .offers-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card-body { padding: 10px; }
      .card-img { padding: 8px; }
      .btn-ver-oferta { font-size: 11.5px; padding: 8px 10px; }
      .btn-save span, .btn-share span { display: none; }
    }
  </style>
</head>

  <!-- Main Content -->
  <main class="main-content">
    <div class="sort-bar">
      <span id="offers-count" class="count"></span>
      <div>
        <label for="sort-select" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Ordenar ofertas</label>
        <select id="sort-select" class="sort-select">
          <option value="recent">Mais Recentes</option>
          <option value="discount">Maior Desconto (%)</option>
          <option value="price_asc">Menor Preço</option>
        </select>
      </div>
    </div>

    <!-- Offers Grid -->
    <section aria-live="polite">
      <div id="offers-grid" class="offers-grid">
        <!-- Cards rendered via JS -->
      </div>

      <div id="empty-state" class="empty-state">
        <p style="font-size:32px;margin-bottom:8px;">🔍</p>
        <h3>Nenhuma oferta encontrada</h3>
        <p>Tente limpar a busca ou selecionar outra categoria.</p>
        <button id="reset-filters-btn" type="button" class="btn-reset">
          Mostrar todas as ofertas
        </button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>PegaTudo Ofertas &bull; Preços e disponibilidade sujeitos a alteração pelas lojas parceiras.</p>
  </footer>

  <script>
    const SITE_URL = 'https://pegatudo-vitrine.pages.dev';
    const MAX_ACTIVE_OFFERS = 60;
    const SAVED_STORAGE_KEY = 'pegatudo_saved_offers_v1';
    const DEFAULT_WHATSAPP_VIP = 'https://chat.whatsapp.com/L752rDFc5WHEID7fpD9dkE';
    const DEFAULT_INSTAGRAM_URL = 'https://www.instagram.com/pega.tudo.loja/';

    const CATEGORIES = [
      { key: 'TODOS', label: 'Todas as Ofertas', icon: '🏷️' },
      { key: 'CUPONS', label: 'Cupons', icon: '🎟️' },
      { key: 'SALVOS', label: 'Salvos', icon: '❤️' },
      { key: 'ELETRONICOS', label: 'Eletrônicos', icon: '📱', match: ['ELETRONICO', 'ELETRONICA', 'TV', 'FONE', 'CAIXA DE SOM', 'SMARTWATCH', 'SOM'] },
      { key: 'CASA', label: 'Casa e Cozinha', icon: '🏠', match: ['CASA', 'COZINHA', 'LIQUIDIFICADOR', 'CAFETEIRA', 'AIRFRYER', 'FRITADEIRA', 'PANELA'] },
      { key: 'ELETRODOMESTICOS', label: 'Eletrodomésticos', icon: '🔌', match: ['ELETRODOMESTICO', 'ASPIRADOR', 'VENTILADOR', 'FERRO', 'LAVADORA', 'GELADEIRA'] },
      { key: 'CELULARES', label: 'Celulares', icon: '📲', match: ['CELULAR', 'SMARTPHONE', 'IPHONE', 'SAMSUNG GALAXY', 'MOTOROLA', 'XIAOMI'] },
      { key: 'INFORMATICA', label: 'Informática', icon: '💻', match: ['INFORMATICA', 'NOTEBOOK', 'SSD', 'HD', 'TECLADO', 'MOUSE', 'MONITOR', 'COMPUTADOR', 'MEMORIA', 'PROCESSADOR'] },
      { key: 'BELEZA', label: 'Beleza e Saúde', icon: '💄', match: ['BELEZA', 'SAUDE', 'PERFUME', 'MAQUIAGEM', 'SHAMPOO', 'CREME', 'COSMETICO'] },
      { key: 'AUTOMOTIVO', label: 'Automotivo', icon: '🚗', match: ['AUTOMOTIVO', 'CARRO', 'MOTO', 'PNEU', 'PECAS', 'OLEO', 'ACESSORIO AUTO'] },
      { key: 'ESPORTE', label: 'Esporte e Lazer', icon: '⚽', match: ['ESPORTE', 'LAZER', 'BICICLETA', 'TENIS', 'ACADEMIA', 'FITNESS', 'BRINQUEDO', 'JOGO'] },
    ];

    const STORE_FILTERS = [
      { key: 'MERCADO LIVRE', label: 'Mercado Livre', dot: 'dot-ml' },
      { key: 'SHOPEE', label: 'Shopee', dot: 'dot-shopee' },
      { key: 'AMAZON', label: 'Amazon', dot: 'dot-amazon' },
      { key: 'MAGALU', label: 'Magalu', dot: 'dot-magalu' },
    ];

    const STORE_DOTS = {
      'MERCADO LIVRE': 'dot-ml',
      'SHOPEE': 'dot-shopee',
      'AMAZON': 'dot-amazon',
      'MAGALU': 'dot-magalu',
    };

    function loadSavedIds() {
      try {
        const raw = localStorage.getItem(SAVED_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(parsed) ? parsed.map(String) : []);
      } catch (_) {
        return new Set();
      }
    }

    function persistSavedIds(idSet) {
      try {
        localStorage.setItem(SAVED_STORAGE_KEY, JSON.stringify([...idSet]));
      } catch (_) {}
    }

    function getInitialUrlState() {
      try {
        const params = new URLSearchParams(window.location.search);
        return {
          ofertaId: params.get('oferta') || '',
          catParam: (params.get('cat') || params.get('loja') || '').toUpperCase(),
        };
      } catch (_) {
        return { ofertaId: '', catParam: '' };
      }
    }

    const urlState = getInitialUrlState();

    const state = {
      ofertas: [],
      selectedCategory: 'TODOS',
      selectedStore: '',
      searchQuery: '',
      sortBy: 'recent',
      savedIds: loadSavedIds(),
      highlightedId: urlState.ofertaId,
      config: {
        nomeSite: 'PegaTudo Ofertas',
        whatsappVip: DEFAULT_WHATSAPP_VIP,
        instagram: DEFAULT_INSTAGRAM_URL,
        atualizadoEm: '',
      },
    };

    // Set initial category from URL
    const validCatKeys = CATEGORIES.map(c => c.key);
    if (validCatKeys.includes(urlState.catParam)) {
      state.selectedCategory = urlState.catParam;
    } else {
      const storeMatch = STORE_FILTERS.find(s => s.key === urlState.catParam);
      if (storeMatch) {
        state.selectedStore = storeMatch.key;
      }
    }

    const brlFormatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

    function normalizeText(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function isValidHttpUrl(url) {
      return typeof url === 'string' && /^https?:\/\//i.test(url.trim());
    }

    function isValidOffer(item) {
      if (!item || item.ativo === false) return false;
      if (!isValidHttpUrl(item.imagem)) return false;
      const precoPor = Number(item.precoPor || 0);
      const temCupom = Boolean(String(item.cupom || '').trim());
      return precoPor > 0 || temCupom;
    }

    function getOfferTimestamp(item) {
      const raw = item?.adicionadoEm || item?.criadoEm || item?.dataCadastro || item?.createdAt || '';
      if (!raw) return null;
      const ms = Date.parse(raw);
      return Number.isNaN(ms) ? null : ms;
    }

    function formatRelativeTime(item, fallbackIso) {
      const itemMs = getOfferTimestamp(item);
      const fallbackMs = fallbackIso ? Date.parse(fallbackIso) : NaN;
      const targetMs = itemMs !== null ? itemMs : (!Number.isNaN(fallbackMs) ? fallbackMs : null);
      if (targetMs === null) return '';
      const diffMs = Math.max(0, Date.now() - targetMs);
      const diffMinutes = Math.floor(diffMs / 60000);
      if (diffMinutes < 5) return 'Agora';
      if (diffMinutes < 60) return `Há ${diffMinutes} min`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return diffHours === 1 ? 'Há 1 hora' : `Há ${diffHours} horas`;
      const now = new Date();
      const target = new Date(targetMs);
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const startOfTarget = new Date(target.getFullYear(), target.getMonth(), target.getDate()).getTime();
      const diffDays = Math.round((startOfToday - startOfTarget) / 86400000);
      if (diffDays <= 0) return 'Hoje';
      if (diffDays === 1) return 'Ontem';
      if (diffDays < 7) return `Há ${diffDays} dias`;
      return target.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    }

    function getDiscountPercent(precoDe, precoPor) {
      const de = Number(precoDe);
      const por = Number(precoPor);
      if (!de || !por || de <= por) return 0;
      return Math.round(((de - por) / de) * 100);
    }

    function matchesCategory(item, catKey) {
      const cat = CATEGORIES.find(c => c.key === catKey);
      if (!cat || !cat.match) return false;
      const titulo = normalizeText(item.titulo);
      const loja = normalizeText(item.loja);
      const haystack = titulo + ' ' + loja;
      return cat.match.some(kw => haystack.includes(normalizeText(kw)));
    }

    function buildWhatsAppShareUrl(item) {
      const cupom = String(item.cupom || '').trim();
      const regra = String(item.regra_cupom || '').trim();
      const hasPrice = Number(item.precoPor) > 0;
      const discount = getDiscountPercent(item.precoDe, item.precoPor);
      const ofertaUrl = item.id ? `${SITE_URL}/?oferta=${encodeURIComponent(String(item.id))}` : `${SITE_URL}/`;
      const lines = [
        `🔥 *${item.titulo}*`,
        `🏪 Loja: ${String(item.loja || 'Oferta').toUpperCase()}`,
      ];
      if (hasPrice) {
        const discountLabel = discount > 0 ? ` (-${discount}%)` : '';
        lines.push(`💰 Por apenas *${brlFormatter.format(Number(item.precoPor))}*${discountLabel}`);
      } else if (regra) {
        lines.push(`🏷️ Benefício: *${regra}*`);
      }
      if (cupom) lines.push(`🎟️ Cupom: *${cupom}*`);
      lines.push(`👉 Confira na vitrine: ${ofertaUrl}`);
      return `https://wa.me/?text=${encodeURIComponent(lines.join('\n'))}`;
    }

    function renderVipBanner(index) {
      const whatsappHref = escapeHtml(state.config.whatsappVip || DEFAULT_WHATSAPP_VIP);
      const instaHref = escapeHtml(state.config.instagram || DEFAULT_INSTAGRAM_URL);
      return `
        <aside class="vip-banner" aria-label="Entre no Grupo VIP" data-vip-banner="${index}">
          <div class="vip-banner-text">
            <div class="vip-banner-tag">⚡ Alertas em Primeira Mão</div>
            <h3>Receba cupons relâmpago antes que acabem!</h3>
            <p>Entre no <strong>Grupo VIP do WhatsApp</strong> e siga <strong>@pega.tudo.loja</strong> no Instagram para pegar achados e promoções todos os dias.</p>
          </div>
          <div class="vip-banner-actions">
            <a href="${whatsappHref}" target="_blank" rel="noopener noreferrer" class="btn-vip">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.01c-.24.68-1.41 1.3-1.95 1.38-.5.07-1.13.1-1.82-.12-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.18-4.94-4.38-.14-.19-1.18-1.57-1.18-3 0-1.43.75-2.13 1.01-2.42.27-.29.58-.36.77-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.1.19-.15.31-.29.48-.14.17-.3.38-.43.51-.14.14-.29.3-.13.59.17.29.74 1.22 1.59 1.98 1.1.98 2.02 1.28 2.31 1.43.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.64-.14.27.1 1.68.79 1.97.94.29.14.48.22.55.34.07.12.07.7-.17 1.38z"/></svg>
              <span>Entrar no Grupo VIP</span>
            </a>
            <a href="${instaHref}" target="_blank" rel="noopener noreferrer" class="btn-insta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
              <span>Seguir @pega.tudo.loja</span>
            </a>
          </div>
        </aside>
      `;
    }

    function updateSeoMetadata(offers, config) {
      const siteName = config?.nomeSite || 'PegaTudo Ofertas';
      const focused = state.highlightedId
        ? offers.find((o) => String(o.id) === String(state.highlightedId))
        : null;

      let title = `${siteName} — As Melhores Ofertas e Cupons do Dia`;
      let description = `Confira ${offers.length} ofertas e cupons verificados do Mercado Livre, Shopee, Amazon, Magalu e grandes lojas atualizados em tempo real.`;
      let pageUrl = `${SITE_URL}/`;
      let image = offers[0]?.imagem || 'https://placehold.co/1200x630/1a73e8/ffffff?text=PegaTudo+Ofertas';

      if (focused) {
        const cupomTxt = focused.cupom ? ` | Cupom: ${focused.cupom}` : '';
        const precoTxt = Number(focused.precoPor) > 0 ? ` por ${brlFormatter.format(Number(focused.precoPor))}` : '';
        title = `${focused.titulo}${precoTxt} — ${siteName}`;
        description = `Oferta na loja ${String(focused.loja || '').toUpperCase()}${precoTxt}${cupomTxt}. Garimpada pelo ${siteName}.`;
        pageUrl = `${SITE_URL}/?oferta=${encodeURIComponent(String(focused.id))}`;
        image = focused.imagem || image;
      }

      document.title = title;
      const setAttr = (id, attr, val) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, val); };
      setAttr('meta-description', 'content', description);
      setAttr('canonical-link', 'href', pageUrl);
      setAttr('og-site-name', 'content', siteName);
      setAttr('og-title', 'content', title);
      setAttr('og-description', 'content', description);
      setAttr('og-url', 'content', pageUrl);
      setAttr('og-image', 'content', image);
      setAttr('twitter-title', 'content', title);
      setAttr('twitter-description', 'content', description);
      setAttr('twitter-image', 'content', image);

      const ldEl = document.getElementById('structured-data');
      if (ldEl) {
        const ldJson = {
          '@context': 'https://schema.org',
          '@type': 'ItemList',
          name: title, description, url: pageUrl,
          numberOfItems: offers.length,
          itemListElement: offers.slice(0, 20).map((item, idx) => ({
            '@type': 'ListItem',
            position: idx + 1,
            url: item.id ? `${SITE_URL}/?oferta=${encodeURIComponent(String(item.id))}` : `${SITE_URL}/`,
            item: {
              '@type': 'Product',
              name: item.titulo,
              image: item.imagem,
              brand: { '@type': 'Brand', name: String(item.loja || 'PegaTudo Ofertas') },
              offers: {
                '@type': 'Offer',
                priceCurrency: 'BRL',
                price: Number(item.precoPor || 0) > 0 ? Number(item.precoPor).toFixed(2) : '0.00',
                availability: 'https://schema.org/InStock',
                url: item.linkAfiliado,
              },
            },
          })),
        };
        ldEl.textContent = JSON.stringify(ldJson);
      }
    }

    function renderTabs() {
      const container = document.getElementById('filter-tabs');
      let html = '';

      // Category tabs
      CATEGORIES.forEach((cat) => {
        const isActive = state.selectedCategory === cat.key && !state.selectedStore;
        let count = 0;
        if (cat.key === 'TODOS') {
          count = state.ofertas.length;
        } else if (cat.key === 'SALVOS') {
          count = state.ofertas.filter((o) => state.savedIds.has(String(o.id))).length;
        } else if (cat.key === 'CUPONS') {
          count = state.ofertas.filter((o) => Boolean(String(o.cupom || '').trim())).length;
        } else {
          count = state.ofertas.filter((o) => matchesCategory(o, cat.key)).length;
        }

        html += `
          <button type="button" role="tab" aria-selected="${isActive}" data-cat="${escapeHtml(cat.key)}"
            class="cat-btn ${isActive ? 'active' : ''}">
            <span style="font-size:13px">${cat.icon}</span>
            <span>${escapeHtml(cat.label)}</span>
            <span class="cat-count">${count}</span>
          </button>
        `;
      });

      // Separator
      html += `<span style="display:inline-block;width:1px;height:24px;background:var(--border);margin:0 4px;flex-shrink:0"></span>`;

      // Store filter tabs
      STORE_FILTERS.forEach((store) => {
        const isActive = state.selectedStore === store.key;
        const count = state.ofertas.filter((o) => String(o.loja || '').toUpperCase() === store.key).length;
        html += `
          <button type="button" role="tab" aria-selected="${isActive}" data-store="${escapeHtml(store.key)}"
            class="cat-btn ${isActive ? 'active' : ''}">
            <span class="cat-dot ${store.dot}"></span>
            <span>${escapeHtml(store.label)}</span>
            <span class="cat-count">${count}</span>
          </button>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll('button[data-cat]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedCategory = btn.getAttribute('data-cat');
          state.selectedStore = '';
          renderTabs();
          renderOffers();
        });
      });
      container.querySelectorAll('button[data-store]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedStore = btn.getAttribute('data-store');
          state.selectedCategory = '';
          renderTabs();
          renderOffers();
        });
      });
    }

    function sortOffers(list) {
      const copy = list.slice();
      if (state.sortBy === 'discount') {
        copy.sort((a, b) => {
          const discDiff = getDiscountPercent(b.precoDe, b.precoPor) - getDiscountPercent(a.precoDe, a.precoPor);
          if (discDiff !== 0) return discDiff;
          return (b.cupom ? 1 : 0) - (a.cupom ? 1 : 0);
        });
      } else if (state.sortBy === 'price_asc') {
        copy.sort((a, b) => {
          const pa = Number(a.precoPor) > 0 ? Number(a.precoPor) : Number.POSITIVE_INFINITY;
          const pb = Number(b.precoPor) > 0 ? Number(b.precoPor) : Number.POSITIVE_INFINITY;
          return pa - pb;
        });
      } else {
        copy.sort((a, b) => {
          const ta = getOfferTimestamp(a);
          const tb = getOfferTimestamp(b);
          if (ta !== null && tb !== null && tb !== ta) return tb - ta;
          if (ta !== null && tb === null) return -1;
          if (tb !== null && ta === null) return 1;
          return (a._sourceIndex ?? 0) - (b._sourceIndex ?? 0);
        });
      }
      if (state.highlightedId && state.sortBy === 'recent') {
        const idx = copy.findIndex((o) => String(o.id) === String(state.highlightedId));
        if (idx > 0) { const [match] = copy.splice(idx, 1); copy.unshift(match); }
      }
      return copy;
    }

    function renderOffers() {
      const grid = document.getElementById('offers-grid');
      const empty = document.getElementById('empty-state');
      const countEl = document.getElementById('offers-count');
      const query = normalizeText(state.searchQuery);

      const filtered = state.ofertas.filter((item) => {
        const loja = String(item.loja || '').toUpperCase();
        const temCupom = Boolean(String(item.cupom || '').trim());
        const isSaved = state.savedIds.has(String(item.id));

        // Store filter
        if (state.selectedStore) {
          if (loja !== state.selectedStore) return false;
        }
        // Category filter
        else if (state.selectedCategory === 'SALVOS') {
          if (!isSaved) return false;
        } else if (state.selectedCategory === 'CUPONS') {
          if (!temCupom) return false;
        } else if (state.selectedCategory && state.selectedCategory !== 'TODOS') {
          if (!matchesCategory(item, state.selectedCategory)) return false;
        }

        if (!query) return true;
        const haystack = normalizeText(`${item.titulo} ${item.loja} ${item.id} ${item.cupom || ''} ${item.regra_cupom || ''}`);
        return haystack.includes(query);
      });

      const sorted = sortOffers(filtered);
      countEl.textContent = `${sorted.length} ${sorted.length === 1 ? 'oferta' : 'ofertas'}`;

      if (sorted.length === 0) {
        grid.innerHTML = '';
        empty.classList.add('visible');
        return;
      }
      empty.classList.remove('visible');

      const chunks = [];
      sorted.forEach((item, index) => {
        const loja = String(item.loja || 'OFERTA').toUpperCase();
        const dotClass = STORE_DOTS[loja] || 'dot-default';
        const discount = getDiscountPercent(item.precoDe, item.precoPor);
        const hasPrice = Number(item.precoPor) > 0;
        const hasOldPrice = hasPrice && Number(item.precoDe) > Number(item.precoPor);
        const cupom = String(item.cupom || '').trim();
        const regraCupom = String(item.regra_cupom || '').trim();
        const relativeTime = formatRelativeTime(item, state.config.atualizadoEm);
        const isSaved = state.savedIds.has(String(item.id));
        const isHighlighted = state.highlightedId && String(item.id) === String(state.highlightedId);
        const whatsappShareUrl = buildWhatsAppShareUrl(item);

        chunks.push(`
          <article class="card ${isHighlighted ? 'highlighted' : ''}">
            <div class="card-img">
              <img src="${escapeHtml(item.imagem)}" alt="${escapeHtml(item.titulo)}" loading="lazy"
                onerror="this.src='https://placehold.co/400x400/f5f5f5/aaa?text=PegaTudo'" />
              <span class="card-store-badge">
                <span class="store-dot ${dotClass}"></span>
                ${escapeHtml(loja)}
              </span>
              ${discount > 0 ? `<span class="card-discount-badge">-${discount}%</span>` : (cupom && !hasPrice ? `<span class="card-coupon-badge">CUPOM</span>` : '')}
              ${relativeTime ? `
                <span class="card-time-badge">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                  ${escapeHtml(relativeTime)}
                </span>
              ` : ''}
            </div>

            <div class="card-body">
              ${isHighlighted ? '<span class="card-highlighted-tag">⭐ Oferta em destaque</span>' : ''}
              <h2 class="card-title">${escapeHtml(item.titulo)}</h2>

              <div class="card-pricing">
                ${hasPrice ? `
                  ${hasOldPrice ? `<p class="card-price-old">De ${brlFormatter.format(Number(item.precoDe))}</p>` : '<p style="height:16px"></p>'}
                  <p class="card-price-current">${brlFormatter.format(Number(item.precoPor))}</p>
                ` : `
                  <p class="card-coupon-only-label">Cupom de Desconto</p>
                  <p class="card-coupon-only-value">${escapeHtml(regraCupom || 'Desconto na Loja')}</p>
                `}

                ${cupom ? `
                  <div class="card-coupon-strip">
                    <div class="card-coupon-strip-top">
                      <span class="card-coupon-strip-label">🎟️ Cupom</span>
                      <code>${escapeHtml(cupom)}</code>
                    </div>
                    ${regraCupom && hasPrice ? `<p class="card-coupon-strip-rule">${escapeHtml(regraCupom)}</p>` : ''}
                  </div>
                ` : ''}
              </div>

              <div class="card-actions">
                <div class="card-actions-row">
                  ${cupom ? `
                    <button type="button" data-copy-coupon="${escapeHtml(cupom)}" class="btn-copy-coupon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                      </svg>
                      <span class="copy-label">Copiar Cupom</span>
                    </button>
                  ` : ''}
                  <a href="${escapeHtml(item.linkAfiliado)}" target="_blank" rel="noopener noreferrer sponsored" class="btn-ver-oferta">
                    <span>Ver Oferta na Loja</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                      <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
                    </svg>
                  </a>
                </div>
                <div class="card-actions-row">
                  <button type="button" data-save-offer="${escapeHtml(item.id)}" aria-pressed="${isSaved}"
                    class="btn-save ${isSaved ? 'saved' : ''}">
                    <svg viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" aria-hidden="true">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
                    </svg>
                    <span>${isSaved ? 'Salvo' : 'Salvar'}</span>
                  </button>
                  <a href="${escapeHtml(whatsappShareUrl)}" target="_blank" rel="noopener noreferrer" class="btn-share">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="color:#25D366">
                      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.01c-.24.68-1.41 1.3-1.95 1.38-.5.07-1.13.1-1.82-.12-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.18-4.94-4.38-.14-.19-1.18-1.57-1.18-3 0-1.43.75-2.13 1.01-2.42.27-.29.58-.36.77-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.1.19-.15.31-.29.48-.14.17-.3.38-.43.51-.14.14-.29.3-.13.59.17.29.74 1.22 1.59 1.98 1.1.98 2.02 1.28 2.31 1.43.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.64-.14.27.1 1.68.79 1.97.94.29.14.48.22.55.34.07.12.07.7-.17 1.38z"/>
                    </svg>
                    <span>Compartilhar</span>
                  </a>
                </div>
              </div>
            </div>
          </article>
        `);

        if ((index + 1) % 8 === 0) {
          chunks.push(renderVipBanner(index + 1));
        }
      });

      grid.innerHTML = chunks.join('');

      // Coupon copy handlers
      grid.querySelectorAll('button[data-copy-coupon]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const code = btn.getAttribute('data-copy-coupon') || '';
          if (!code) return;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(code);
            } else {
              const ta = document.createElement('textarea');
              ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
              document.body.appendChild(ta); ta.select();
              document.execCommand('copy'); document.body.removeChild(ta);
            }
          } catch (_) {}
          const label = btn.querySelector('.copy-label');
          if (!label) return;
          const original = label.textContent;
          label.textContent = 'Copiado! ✓';
          btn.classList.add('copied');
          setTimeout(() => { label.textContent = original; btn.classList.remove('copied'); }, 2000);
        });
      });

      // Save handlers
      grid.querySelectorAll('button[data-save-offer]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = String(btn.getAttribute('data-save-offer') || '');
          if (!id) return;
          if (state.savedIds.has(id)) { state.savedIds.delete(id); } else { state.savedIds.add(id); }
          persistSavedIds(state.savedIds);
          renderTabs();
          renderOffers();
        });
      });
    }

    function applyConfig(config) {
      if (!config || typeof config !== 'object') return;
      state.config.atualizadoEm = config.atualizadoEm || '';
      if (config.nomeSite) {
        state.config.nomeSite = config.nomeSite;
      }
      if (config.whatsappVip) {
        state.config.whatsappVip = config.whatsappVip;
        document.getElementById('btn-whatsapp').href = config.whatsappVip;
      }
      const hasCustomInsta = config.instagram && !/^https?:\/\/(www\.)?instagram\.com\/?$/i.test(String(config.instagram).trim());
      state.config.instagram = hasCustomInsta ? config.instagram : DEFAULT_INSTAGRAM_URL;
      document.getElementById('btn-instagram').href = state.config.instagram;
    }

    async function loadOffers() {
      const grid = document.getElementById('offers-grid');
      grid.innerHTML = Array.from({ length: 8 }).map(() => `
        <div class="skeleton">
          <div style="aspect-ratio:1/1;padding:16px"><div class="skeleton-block" style="width:100%;height:100%"></div></div>
          <div style="padding:14px;display:flex;flex-direction:column;gap:8px">
            <div class="skeleton-block" style="height:14px;width:85%"></div>
            <div class="skeleton-block" style="height:14px;width:60%"></div>
            <div class="skeleton-block" style="height:24px;width:45%"></div>
            <div class="skeleton-block" style="height:38px;width:100%;border-radius:8px"></div>
          </div>
        </div>
      `).join('');

      try {
        const response = await fetch("./ofertas.json?v=" + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        applyConfig(data.config);
        const rawOffers = Array.isArray(data.ofertas) ? data.ofertas : [];
        const validOffers = rawOffers
          .map((item, idx) => (item ? { ...item, _sourceIndex: idx } : null))
          .filter(isValidOffer);

        validOffers.sort((a, b) => {
          const ta = getOfferTimestamp(a);
          const tb = getOfferTimestamp(b);
          if (ta !== null && tb !== null && tb !== ta) return tb - ta;
          if (ta !== null && tb === null) return -1;
          if (tb !== null && ta === null) return 1;
          return a._sourceIndex - b._sourceIndex;
        });

        state.ofertas = validOffers.slice(0, MAX_ACTIVE_OFFERS);
        updateSeoMetadata(state.ofertas, state.config);
        renderTabs();
        renderOffers();
      } catch (err) {
        console.error('Erro ao carregar ofertas:', err);
        grid.innerHTML = '';
        document.getElementById('empty-state').classList.add('visible');
        renderTabs();
      }
    }

    document.getElementById('search-input').addEventListener('input', (event) => {
      state.searchQuery = event.target.value;
      renderOffers();
    });

    document.getElementById('sort-select').addEventListener('change', (event) => {
      state.sortBy = event.target.value || 'recent';
      renderOffers();
    });

    document.getElementById('reset-filters-btn').addEventListener('click', () => {
      state.selectedCategory = 'TODOS';
      state.selectedStore = '';
      state.searchQuery = '';
      state.sortBy = 'recent';
      state.highlightedId = '';
      document.getElementById('search-input').value = '';
      document.getElementById('sort-select').value = 'recent';
      renderTabs();
      renderOffers();
    });

    loadOffers();
  </script>
</body>
</html>
